<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Olympus Unbound</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="img/extras/logo/logo-olympus.png">
<link rel="apple-touch-icon" href="img/extras/logo/logo-olympus.png">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo-block">
      <div class="logo">OLYMPUS UNBOUND</div>
      <div class="logo-sub">M i t o l o g í a · G r i e g a</div>
    </div>
    <div id="resRow">
      <div class="chip gold-chip" title="Tocar para abrir tienda"><span class="ic">🪙</span><span id="goldTxt">0</span></div>
      <div class="chip gem-chip" title="Tocar para abrir tienda"><span class="ic">💎</span><span id="gemsTxt">0</span></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav id="tabs">
  <button class="tab active" data-tab="home"><span class="t-ic">⚔️</span>Batalla</button>
  <button class="tab" data-tab="training"><span class="t-ic">🏋️</span>Entrenar</button>
  <button class="tab" data-tab="games"><span class="t-ic">🎮</span>Minijuegos</button>
  <button class="tab" data-tab="team"><span class="t-ic">🛡️</span>Equipo</button>
  <button class="tab" data-tab="collection"><span class="t-ic">📜</span>Colección</button>
  <button class="tab" data-tab="index"><span class="t-ic">📖</span>Índice</button>
  <button class="tab" data-tab="shop"><span class="t-ic">🏛️</span>Tienda</button>
</nav>

<div id="overlay"></div>
<div id="toast"></div>

<script src="js/00-img.js"></script>
<script src="js/01-data.js"></script>
<script src="js/02-state.js"></script>
<script src="js/03-utils.js"></script>
<script src="js/04-ui.js"></script>
<script src="js/05-shop.js"></script>
<script src="js/06-collection.js"></script>
<script src="js/07-team.js"></script>
<script src="js/08-battle.js"></script>
<script src="js/09-training.js"></script>
<script src="js/10-main.js"></script>
<script src="js/11-index.js"></script>
<script src="js/12-games.js"></script>
</body>
</html>
